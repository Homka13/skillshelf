name: Snyk skill scan

# Checks every skill in the plugin with Snyk Agent Scan: prompt injection,
# malicious code, secrets, suspicious downloads and similar risks.
# Needs a repository secret SNYK_TOKEN (Snyk API token).
#
# Manual only: the public Agent Scan quota for our token is exhausted on
# every run (X007). skills.sh runs Snyk, Socket and Gen Agent Trust Hub on
# each published skill instead. Run this by hand if the quota changes.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scan-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Scan skills
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          # Pinned on purpose: bump after reading the release notes.
          AGENT_SCAN_VERSION: "0.6.11"
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::Repository secret SNYK_TOKEN is not set. Add it with: gh secret set SNYK_TOKEN --repo ${{ github.repository }}"
            exit 1
          fi
          # Only the skills folder is passed, so the scanner does not look for
          # agent configs on the runner. The docs require
          # --dangerously-run-mcp-servers with --ci; there are no MCP configs
          # in this path, so nothing is started.
          uvx --python 3.13 "snyk-agent-scan@${AGENT_SCAN_VERSION}" \
            --ci --dangerously-run-mcp-servers \
            ./plugins/skillshelf/skills
